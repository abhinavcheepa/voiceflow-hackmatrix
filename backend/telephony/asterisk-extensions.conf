; VoiceFlow AI — Asterisk dialplan
;
; Our PBX owns the phone number and the call. This dialplan hands the audio leg
; to Vapi over SIP; Vapi then asks our backend which assistant to use via the
; assistant-request webhook. Numbers, routing and CDRs stay on our box.
;
; Prerequisites
;   1. Register the SIP endpoint once (backend must be running):
;        curl -X POST http://localhost:8000/api/vapi/sip-number \
;             -H "Content-Type: application/json" \
;             -d '{"sip_uri":"sip:voiceflow@sip.vapi.ai"}'
;   2. Copy the [vapi] block below into pjsip.conf.
;   3. Include this file from extensions.conf, then `asterisk -rx "dialplan reload"`.

[globals]
VAPI_SIP = PJSIP/voiceflow@vapi

; ── Inbound: a customer rings our number ────────────────────────────────
[from-pstn]
exten => _X.,1,NoOp(VoiceFlow: inbound from ${CALLERID(num)})
 same => n,Set(CDR(userfield)=voiceflow-ai)
 same => n,Answer()
 ; Short pause so the far end has audio before Vapi starts speaking.
 same => n,Wait(0.5)
 same => n,Dial(${VAPI_SIP},60,g)
 ; g = keep going in the dialplan after the far end hangs up, so we can log.
 same => n,NoOp(VoiceFlow: ended with ${DIALSTATUS})
 same => n,Hangup()

; ── Outbound: campaign or callback originated by the backend ────────────
; Trigger with an .call file or AMI Originate into this context.
[voiceflow-outbound]
exten => _X.,1,NoOp(VoiceFlow: dialing ${EXTEN})
 same => n,Set(CALLERID(num)=${OUR_DID})
 same => n,Dial(PJSIP/${EXTEN}@pstn-trunk,45,g)
 same => n,GotoIf($["${DIALSTATUS}" != "ANSWER"]?failed)
 same => n,Dial(${VAPI_SIP},60,g)
 same => n,Hangup()
 same => n(failed),NoOp(VoiceFlow: no answer — ${DIALSTATUS})
 same => n,Hangup()

; ── pjsip.conf — paste into that file, not this one ─────────────────────
;
; [vapi]
; type = endpoint
; transport = transport-udp
; context = from-vapi
; disallow = all
; allow = ulaw,alaw,opus
; direct_media = no
; rtp_symmetric = yes
; force_rport = yes
; aors = vapi
;
; [vapi]
; type = aor
; contact = sip:sip.vapi.ai:5060
;
; [vapi]
; type = identify
; endpoint = vapi
; match = sip.vapi.ai
