; VoiceFlow AI — chan_mobile (Bluetooth GSM gateway)
;
; Your dedicated Android phone holds the SIM. Asterisk connects to it over
; Bluetooth HFP and treats it as a trunk: calls arriving on the SIM are handed
; to the dialplan, which routes them into our ARI app.
;
;   [Android + SIM] --Bluetooth HFP--> [Ubuntu + Asterisk] --ARI--> [our backend]
;
; Fill in `address` and `port` from `mobile search` — see docs/GSM-GATEWAY.md.
; The values below are placeholders and will not work as-is.

[adapter]
id = blue
; MAC of the LAPTOP's Bluetooth adapter, not the phone. Get it with: hciconfig
address = 00:00:00:00:00:00

[GSM_PHONE_1]
type = phone
; MAC of the Android phone. Get it with: mobile search
address = AA:BB:CC:DD:EE:FF
; RFCOMM channel the phone advertises for Handsfree. `mobile search` prints it.
; It is NOT always 1 — copying a tutorial's value is the usual reason nothing
; connects.
port = 1
context = from-mobile
adapter = blue

; Ring the dialplan rather than auto-answering, so the dialplan decides.
group = 0

; chan_mobile carries ONE call at a time over HFP. A second caller gets busy.
; That is a protocol limit, not a setting — if concurrency matters, this
; approach is the wrong one and you want a SIP trunk.
