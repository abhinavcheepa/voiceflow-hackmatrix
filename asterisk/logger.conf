; VoiceFlow AI — logging
;
; `full` is what you tail while debugging a call. Verbose SIP tracing is off by
; default because it prints credentials; turn it on per-session from the CLI:
;   [Asterisk CLI]  pjsip set logger on

[general]
dateformat = %F %T

[logfiles]
console = notice,warning,error
messages = notice,warning,error
full = notice,warning,error,verbose,dtmf

; Enable only while chasing a bug — this file grows fast and contains call
; metadata (numbers dialled), so treat it as personal data.
; debug = debug
