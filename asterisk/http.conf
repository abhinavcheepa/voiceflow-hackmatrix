; VoiceFlow AI — Asterisk built-in HTTP server
;
; ARI rides on this. Nothing else should.

[general]
enabled = yes

; Localhost only. The AI gateway runs on the same host, so ARI never needs to
; be reachable from the network. Widening this is how people hand out control
; of their PBX. If the gateway ever moves to another host, put it behind TLS
; and a firewall rule rather than binding to 0.0.0.0.
bindaddr = 127.0.0.1
bindport = 8088

; Enable for TLS once this is not localhost-only:
; tlsenable = yes
; tlsbindaddr = 0.0.0.0:8089
; tlscertfile = /etc/asterisk/keys/asterisk.pem
