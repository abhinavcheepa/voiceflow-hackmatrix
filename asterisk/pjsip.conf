; VoiceFlow AI — PJSIP configuration
;
; Two extensions:
;   1001  AI agent      — the dialplan sends this into our ARI app
;   1002  test user     — register a softphone here and dial 1001
;
; SECURITY: there is deliberately no `allowguest` and no anonymous endpoint.
; An Asterisk box reachable from the internet is scanned within hours, and an
; open endpoint means someone else routes international calls on your bill.
; Replace both passwords before this box ever leaves localhost.

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
; Set these two when the box sits behind NAT, otherwise audio goes one way only.
; external_media_address = YOUR.PUBLIC.IP
; external_signaling_address = YOUR.PUBLIC.IP
; local_net = 192.168.0.0/16

; ─── 1001 — AI agent ────────────────────────────────────────────────────
[1001]
type = endpoint
context = voiceflow-inbound
disallow = all
; ulaw first: 8 kHz is what the PSTN delivers anyway, and it's what the media
; layer expects later. opus is here for softphone-to-softphone testing.
allow = ulaw,alaw,opus
auth = 1001-auth
aors = 1001
direct_media = no          ; keep RTP flowing through Asterisk so we can tap it
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes

[1001-auth]
type = auth
auth_type = userpass
username = 1001
password = CHANGE_ME_1001

[1001]
type = aor
max_contacts = 1
remove_existing = yes

; ─── 1002 — test user (softphone) ───────────────────────────────────────
[1002]
type = endpoint
context = voiceflow-internal
disallow = all
allow = ulaw,alaw,opus
auth = 1002-auth
aors = 1002
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes

[1002-auth]
type = auth
auth_type = userpass
username = 1002
password = CHANGE_ME_1002

[1002]
type = aor
max_contacts = 1
remove_existing = yes

; ─── SIP trunk / GSM gateway — Phase 14, left commented ─────────────────
; A GSM gateway registers here exactly like a SIP trunk would. Asterisk cannot
; tell the difference: both are just endpoints that deliver PSTN calls.
;
; [trunk]
; type = endpoint
; context = voiceflow-inbound
; disallow = all
; allow = ulaw,alaw
; auth = trunk-auth
; outbound_auth = trunk-auth
; aors = trunk
; from_user = YOUR_DID
;
; [trunk-auth]
; type = auth
; auth_type = userpass
; username = PROVIDER_USERNAME
; password = PROVIDER_PASSWORD
;
; [trunk]
; type = aor
; contact = sip:sip.provider.example:5060
;
; [trunk-reg]
; type = registration
; outbound_auth = trunk-auth
; server_uri = sip:sip.provider.example
; client_uri = sip:YOUR_DID@sip.provider.example
; retry_interval = 60
;
; ; Only accept traffic that actually came from the provider.
; [trunk-identify]
; type = identify
; endpoint = trunk
; match = sip.provider.example
