; VoiceFlow AI — ARI (Asterisk REST Interface)
;
; The AI gateway authenticates here, opens a WebSocket, and drives channels.

[general]
enabled = yes
; Pretty-printed JSON is easier to read while debugging; turn off in production.
pretty = yes
allowed_origins = http://localhost:8000

[voiceflow]
type = user
read_only = no
; Must match ASTERISK_ARI_PASSWORD in backend/.env. Change it before this box
; is reachable by anything but localhost — ARI can originate calls, which makes
; a leaked password a direct route to toll fraud.
password = CHANGE_ME_ARI
password_format = plain
