; VoiceFlow AI — RTP media ports
;
; Every concurrent call uses a pair of ports from this range, so the range caps
; how many calls the box can carry. 10000-10200 is ~100 calls, plenty for now.
; These are UDP and must be open on the firewall, or you get one-way audio —
; the single most common Asterisk complaint.

[general]
rtpstart = 10000
rtpend = 10200

; Send a keepalive every 2s on silent streams so NAT bindings don't expire
; mid-call and cut the audio.
rtpkeepalive = 2

; Hang up if RTP stops arriving. Without these, a caller whose network dies
; leaves a channel open, holding a port and a session forever.
rtptimeout = 30
rtpholdtimeout = 60
