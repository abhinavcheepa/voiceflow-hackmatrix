; VoiceFlow AI — dialplan
;
; Everything that should reach the AI lands in Stasis(voiceflow-ai), which hands
; the channel to our Python ARI app in backend/asterisk_ari.py.

[general]
static = yes
writeprotect = no

[globals]
; Hard ceiling on any single call, in milliseconds. Runaway calls are the
; cheapest way to run up a telecom bill — this is the seatbelt.
MAX_CALL_MS = 1800000
AI_APP = voiceflow-ai

; ─── Internal: softphone 1002 dials 1001 to reach the agent ─────────────
[voiceflow-internal]
exten => 1001,1,NoOp(VoiceFlow: ${CALLERID(num)} -> AI agent)
 same => n,Set(TIMEOUT(absolute)=${MAX_CALL_MS})
 same => n,Answer()
 same => n,Set(CHANNEL(language)=hi)
 same => n,Stasis(${AI_APP},internal)
 same => n,Hangup()

; Echo test — proves two-way RTP before blaming the AI for silence.
exten => 600,1,NoOp(VoiceFlow: echo test)
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()

; ─── Inbound from the Bluetooth phone (chan_mobile) ─────────────────────
; A call arriving on the SIM in GSM_PHONE_1 lands here. chan_mobile always
; sends it to extension `s` — there is no DID to match on, because the phone
; is the number.
[from-mobile]
exten => s,1,NoOp(VoiceFlow: GSM call from ${CALLERID(num)})
 same => n,Set(TIMEOUT(absolute)=${MAX_CALL_MS})
 same => n,Answer()
 same => n,Set(CHANNEL(language)=hi)
 ; Bluetooth HFP needs a moment to settle before audio flows both ways;
 ; without this the caller misses the first word of the greeting.
 same => n,Wait(1)
 same => n,Stasis(${AI_APP},mobile)
 same => n,Hangup()

; ─── Inbound from a trunk or GSM gateway ────────────────────────────────
[voiceflow-inbound]
exten => _X.,1,NoOp(VoiceFlow: inbound from ${CALLERID(num)} to ${EXTEN})
 same => n,Set(TIMEOUT(absolute)=${MAX_CALL_MS})
 same => n,Answer()
 same => n,Set(CHANNEL(language)=hi)
 ; Brief pause so the far end has audio established before the agent speaks.
 same => n,Wait(0.5)
 same => n,Stasis(${AI_APP},inbound)
 same => n,Hangup()

; Anything that isn't a number we recognise gets dropped, not routed.
exten => i,1,NoOp(VoiceFlow: invalid extension ${EXTEN})
 same => n,Hangup()

; ─── Outbound — Phase 14, needs a trunk ─────────────────────────────────
; No wildcard outbound context exists on purpose. A dialplan that will dial
; anything is how toll fraud turns into a real bill.
[voiceflow-outbound]
exten => _+91XXXXXXXXXX,1,NoOp(VoiceFlow: dialing ${EXTEN})
 same => n,Set(TIMEOUT(absolute)=${MAX_CALL_MS})
 same => n,Dial(PJSIP/${EXTEN}@trunk,45)
 same => n,Hangup()
